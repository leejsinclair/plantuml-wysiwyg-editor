<!doctype html>
<meta charset="utf-8">
<script type="module">
  import { ready, render } from '/host.js';
  const t = performance.now();
  ready.then(() => parent.postMessage({ type: 'ready', ms: performance.now() - t }, '*'),
             (e) => parent.postMessage({ type: 'fatal', message: String(e) }, '*'));
  addEventListener('message', async (e) => {
    const r = await render(e.data.text);
    parent.postMessage({ ...r, id: e.data.id }, '*');
  });
</script>
